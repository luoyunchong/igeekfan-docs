# This is a basic workflow to help you get started with Actions
name: Deploy To Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          # if your docs needs submodules, uncomment the following line
          # submodules: true


      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 7
          run_install: true


      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Build Docs
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm run build

      - name: Deploy to Server
        env:
          DOCS_DEPLOY_SSH_KEY_B64: ${{ secrets.DOCS_DEPLOY_SSH_KEY_B64 }}
          DOCS_DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$DOCS_DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/docs_deploy"
          chmod 600 "$HOME/.ssh/docs_deploy"
          printf '%s\n' "$DOCS_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/docs_deploy" > /dev/null
          rsync -rz --delete \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='*cnb.txt' \
            -e "ssh -i $HOME/.ssh/docs_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            docs/.vuepress/dist/ "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_TARGET}"
